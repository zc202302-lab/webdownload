name: Build Windows EXE
on:
  push:
    branches: [main, feature/windows-exe]
    paths: ['ebook_collector/**', 'tests/**', 'build_windows.py', '.github/workflows/windows-exe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r ebook_collector/requirements.txt pyinstaller==6.22.0
      - name: Offline regression tests
        run: python tests/run_tests.py
      - name: Build and smoke-test executable
        run: python build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: WebDownload-Windows-x64
          path: |
            dist/WebDownload.exe
            dist/SHA256SUMS.txt
      - name: Publish new version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import sys; sys.path.insert(0,'ebook_collector'); from app_runtime import VERSION; print(VERSION)"
          gh release view "v$version" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$version" dist/WebDownload.exe dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "WebDownload v$version" --notes "Windows x64 portable EXE. Includes magazine and recipe downloads, resume verification and a Check for updates button. Requires installed Microsoft Edge or Google Chrome. Keep settings.json, output and browser_profile folders when replacing the EXE."
            if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          }
          exit 0
