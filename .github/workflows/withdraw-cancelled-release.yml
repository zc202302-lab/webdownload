name: Withdraw cancelled v1.0.13
on:
  push:
    branches: [main]
    paths: ['.github/workflows/withdraw-cancelled-release.yml']
permissions:
  actions: write
  contents: write
jobs:
  withdraw:
    runs-on: ubuntu-latest
    steps:
      - name: Stop cancelled build and withdraw its release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run cancel 38595605361 || true
          for attempt in 1 2 3 4 5 6; do
            status=$(gh run view 38595605361 --json status --jq .status)
            if [ "$status" = "completed" ]; then break; fi
            sleep 5
          done
          status=$(gh run view 38595605361 --json status --jq .status)
          test "$status" = "completed"
          if gh release view v1.0.13 >/dev/null 2>&1; then
            target=$(gh release view v1.0.13 --json targetCommitish --jq .targetCommitish)
            test "$target" = "8e97fa8aae74d6455686f02f87b51193e1d89176"
            gh release delete v1.0.13 --yes --cleanup-tag
          fi
